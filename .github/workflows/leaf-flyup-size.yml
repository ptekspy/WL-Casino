name: Leaf collection flyup size

on:
  push:
    branches:
      - agent/leaf-flyup-size

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/leaf-flyup-size

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Reduce only the leaf collection flyup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/wildwood-pixi-board.tsx")
          source = path.read_text()
          old = '''    // Keep the collection-to-pot feedback readable without covering nearby tiles.
    token.width = 18;
    token.height = 18;'''
          new = '''    // The leaf artwork fills more of its texture than the other symbols, so it
    // needs a smaller fly-up footprint while every other collection token stays unchanged.
    const tokenSize = symbol === "leaf" ? 14 : 18;
    token.width = tokenSize;
    token.height = tokenSize;'''
          if source.count(old) != 1:
              raise SystemExit(f"Expected exactly one fly-up size block, found {source.count(old)}")
          path.write_text(source.replace(old, new))
          PY

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm sim -- --runs 200000 --out reports/wildwood-smoke.md
      - run: pnpm build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/wildwood-pixi-board.tsx
          git commit -m "Reduce leaf collection flyup size"
          git push
