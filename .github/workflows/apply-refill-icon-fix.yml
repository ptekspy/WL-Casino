name: Apply refill icon fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-refill-icon-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch cascade refill rendering
        run: node scripts/apply-refill-icon-fix.cjs

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Commit fix to main
        run: |
          rm .github/workflows/apply-refill-icon-fix.yml
          rm scripts/apply-refill-icon-fix.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/wildwood-pixi-board.tsx .github/workflows/apply-refill-icon-fix.yml scripts/apply-refill-icon-fix.cjs
          git commit -m "fix: restore cascade refill symbols"
          git push origin HEAD:main
