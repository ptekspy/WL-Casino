name: Apply linear cascade values

on:
  push:
    branches:
      - agent/linear-cascade-values

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply implementation
        run: |
          node --check scripts/apply-linear-cascade-values-v2.mjs
          node scripts/apply-linear-cascade-values-v2.mjs
          git diff --check

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Simulation smoke test
        run: pnpm sim -- --runs 200000 --out reports/wildwood-linear-cascade-smoke.md

      - name: Build
        run: pnpm build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/wildwood.ts src/lib/wildwood.test.ts src/components/wildwood-pixi-board.tsx
          git commit -m "Implement linear cascade collectable values"
          git push origin HEAD:${GITHUB_REF_NAME}
