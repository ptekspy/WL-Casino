name: Apply premium presentation

on:
  push:
    branches:
      - agent/premium-presentation-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/premium-presentation-final
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply Pixi presentation patch
        run: python scripts/apply-premium-presentation.py

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm sim -- --runs 200000 --out reports/wildwood-smoke.md
      - run: pnpm build

      - name: Commit Pixi implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/wildwood-pixi-board.tsx
          git commit -m "Implement premium Wildwood presentation"
          git push
