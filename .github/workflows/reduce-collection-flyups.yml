name: Reduce collection flyups

on:
  push:
    branches:
      - agent/reduce-collection-flyups

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reduce-collection-flyups

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Reduce collected-symbol flyup size
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/wildwood-pixi-board.tsx")
          source = path.read_text()
          old = """    token.width = 24;\n    token.height = 24;"""
          new = """    // Keep the collection-to-pot feedback readable without covering nearby tiles.\n    token.width = 18;\n    token.height = 18;"""
          if source.count(old) != 1:
              raise SystemExit(f"Expected exactly one collection flyup size block, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm sim -- --runs 200000 --out reports/wildwood-smoke.md
      - run: pnpm build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/wildwood-pixi-board.tsx
          git commit -m "Reduce collection flyup size"
          git push
