name: Apply persistent Spirit Seeds

on:
  push:
    branches:
      - agent/persistent-spirit-seeds

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply implementation
        run: node scripts/apply-persistent-seeds.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Retune payout scalars
        run: |
          pnpm sim -- --tune --tuneRuns 200000 | tee /tmp/wildwood-tune.log
          BASE_SCALAR=$(grep -oE 'baseScalar: [0-9.]+' /tmp/wildwood-tune.log | tail -1 | awk '{print $2}')
          BONUS_SCALAR=$(grep -oE 'bonusScalar: [0-9.]+' /tmp/wildwood-tune.log | tail -1 | awk '{print $2}')
          test -n "$BASE_SCALAR"
          test -n "$BONUS_SCALAR"
          node - "$BASE_SCALAR" "$BONUS_SCALAR" <<'NODE'
          const fs = require('node:fs');
          const [baseScalar, bonusScalar] = process.argv.slice(2);
          const path = 'src/lib/wildwood.ts';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(/baseScalar: [0-9.]+,/, `baseScalar: ${baseScalar},`);
          source = source.replace(/bonusScalar: [0-9.]+,/, `bonusScalar: ${bonusScalar},`);
          fs.writeFileSync(path, source);
          console.log({ baseScalar, bonusScalar });
          NODE

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Simulation report
        run: pnpm sim -- --runs 200000 --out reports/wildwood-persistent-seeds.md

      - name: Build
        run: pnpm build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/wildwood.ts src/lib/wildwood.test.ts src/components/wildwood-pixi-board.tsx
          git commit -m "Refine collector movement and persist Spirit Seeds"
          git push origin HEAD:${GITHUB_REF_NAME}
