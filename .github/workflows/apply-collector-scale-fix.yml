name: Apply collector scale fix

on:
  push:
    branches:
      - agent/tone-down-collector-scale

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply collector visual scale fix
        run: python scripts/apply-collector-scale-fix.py

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm sim -- --runs 200000 --out reports/wildwood-smoke.md
      - run: pnpm build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/wildwood-pixi-board.tsx
          git commit -m "Tone down collector animation scale"
          git push origin HEAD:${GITHUB_REF_NAME}
