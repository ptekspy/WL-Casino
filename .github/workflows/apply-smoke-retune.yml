name: Apply smoke-seed retune

on:
  push:
    branches:
      - agent/persistent-spirit-seeds

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: node scripts/apply-smoke-retune.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm sim -- --runs 200000 --out reports/wildwood-smoke.md
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: wildwood-smoke-retuned
          path: reports/wildwood-smoke.md
      - name: Commit retune
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/wildwood.ts
          git commit -m "Retune persistent seed payouts"
          git push origin HEAD:${GITHUB_REF_NAME}
