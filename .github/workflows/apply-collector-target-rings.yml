name: Apply collector target rings

on:
  push:
    branches:
      - agent/collector-target-rings

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply implementation
        run: node scripts/apply-collector-target-rings.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Simulation smoke test
        run: pnpm sim -- --runs 200000 --out reports/wildwood-target-rings.md

      - name: Build
        run: pnpm build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/wildwood-pixi-board.tsx src/lib/wildwood.test.ts
          git commit -m "Preview collector ownership on targets"
          git push origin HEAD:${GITHUB_REF_NAME}
