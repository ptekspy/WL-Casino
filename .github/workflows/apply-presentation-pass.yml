name: Apply Wildwood presentation pass

on:
  push:
    branches:
      - agent/wildwood-presentation-pass

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Rebuild presentation patch
        run: |
          : > scripts/apply-presentation-pass.mjs
          for part in scripts/presentation-pass-parts/part-*.b64; do
            echo "Decoding ${part}"
            base64 --decode "${part}" >> scripts/apply-presentation-pass.mjs
          done
          node --check scripts/apply-presentation-pass.mjs

      - name: Apply presentation pass
        run: node scripts/apply-presentation-pass.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Simulation smoke test
        run: pnpm sim -- --runs 200000 --out reports/wildwood-smoke.md

      - name: Production build
        run: pnpm build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/wildwood-pixi-board.tsx src/lib/pixi/sound.ts
          git commit -m "Polish Wildwood presentation"
          git push origin HEAD:${GITHUB_REF_NAME}
